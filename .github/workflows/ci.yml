name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Migration check
        run: |
          DATABASE_URL=sqlite+aiosqlite:///./ci-migration.db uv run alembic upgrade head
          DATABASE_URL=sqlite+aiosqlite:///./ci-migration.db uv run alembic downgrade base

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check API through Caddy and the web app
        run: |
          curl -sf http://localhost:8080/health/live
          curl -sf http://localhost:8080/ | grep -qi "<title>Kallula</title>"
      - name: Stop stack
        if: always()
        run: docker compose down -v
